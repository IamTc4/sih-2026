[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ── Nginx (Frontend + Reverse Proxy) ─────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-err.log

; ── Blockchain Forensics Service (port 8000) ─────────────────
[program:blockchain]
command=uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/blockchain
autostart=true
autorestart=true
priority=20
environment=
    USE_MOCK_DATA="%(ENV_USE_MOCK_DATA)s",
    TRONGRID_API_KEY="%(ENV_TRONGRID_API_KEY)s",
    TRON_GRID_BASE_URL="%(ENV_TRON_GRID_BASE_URL)s",
    TRONSCAN_BASE_URL="%(ENV_TRONSCAN_BASE_URL)s",
    MAX_TRANSACTIONS_PER_WALLET="%(ENV_MAX_TRANSACTIONS_PER_WALLET)s",
    MAX_HOPS="%(ENV_MAX_HOPS)s",
    FLOW_THRESHOLD_PERCENT="%(ENV_FLOW_THRESHOLD_PERCENT)s",
    MIN_USDT_AMOUNT="%(ENV_MIN_USDT_AMOUNT)s",
    PYTHONPATH="/app/blockchain"
stdout_logfile=/var/log/supervisor/blockchain.log
stderr_logfile=/var/log/supervisor/blockchain-err.log

; ── ML Risk Scoring Service (port 8002) ──────────────────────
; Start ML before agentic-ai as agentic-ai depends on it
[program:ml-risk]
command=uvicorn ml.api:app --host 127.0.0.1 --port 8002
directory=/app/ml_service
autostart=true
autorestart=true
priority=21
environment=
    MODEL_PATH="%(ENV_MODEL_PATH)s",
    HIGH_CONFIDENCE_THRESHOLD="%(ENV_HIGH_CONFIDENCE_THRESHOLD)s",
    MEDIUM_CONFIDENCE_THRESHOLD="%(ENV_MEDIUM_CONFIDENCE_THRESHOLD)s",
    BLOCKCHAIN_API_URL="http://127.0.0.1:8000",
    CYBERSECURITY_API_URL="http://127.0.0.1:8003",
    PYTHONPATH="/app/ml_service"
stdout_logfile=/var/log/supervisor/ml-risk.log
stderr_logfile=/var/log/supervisor/ml-risk-err.log

; ── Cybersecurity & Threat Intel Service (port 8003) ─────────
[program:cybersecurity]
command=uvicorn main:app --host 127.0.0.1 --port 8003
directory=/app/cybersecurity
autostart=true
autorestart=true
priority=22
environment=
    PYTHONPATH="/app/cybersecurity"
stdout_logfile=/var/log/supervisor/cybersecurity.log
stderr_logfile=/var/log/supervisor/cybersecurity-err.log

; ── Agentic AI Orchestration Service (port 8001) ─────────────
[program:agentic-ai]
command=uvicorn walletrace.api:app --host 127.0.0.1 --port 8001
directory=/app/agentic_ai
autostart=true
autorestart=true
priority=30
environment=
    GOOGLE_API_KEY="%(ENV_GOOGLE_API_KEY)s",
    LLM_MODEL="%(ENV_LLM_MODEL)s",
    LLM_TEMPERATURE="%(ENV_LLM_TEMPERATURE)s",
    CONFIDENCE_THRESHOLD="%(ENV_CONFIDENCE_THRESHOLD)s",
    BLOCKCHAIN_API_URL="http://127.0.0.1:8000",
    ML_API_URL="http://127.0.0.1:8002",
    CYBERSECURITY_API_URL="http://127.0.0.1:8003",
    PYTHONPATH="/app/agentic_ai"
stdout_logfile=/var/log/supervisor/agentic-ai.log
stderr_logfile=/var/log/supervisor/agentic-ai-err.log
